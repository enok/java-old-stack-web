# CampusConnect - local stack.
#
# Everything runs in containers so no local JDK, Maven, Tomcat or MySQL is
# needed. The `builder` service produces the WAR; `app` serves it.
#
# Usage:
#   docker compose run --rm builder          # build the WAR
#   docker compose up -d mysql app           # run it
#   http://localhost:8080/
#
# Compose file format 2 on purpose - it is what the original runbook used.
version: '2'

services:

  mysql:
    image: mysql:5.7
    container_name: campusconnect-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: campusconnect
      MYSQL_USER: campusconnect
      MYSQL_PASSWORD: campusconnect
    ports:
      - "3306:3306"
    volumes:
      # schema.sql then seed.sql, in name order, on first start only.
      - ./campusconnect-persistence/src/main/resources/db:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci

  # Builder. Runs Maven inside a JDK 8 image, so the host needs nothing.
  # The named volume caches ~/.m2 between runs.
  builder:
    image: maven:3.6-jdk-8
    container_name: campusconnect-builder
    working_dir: /src
    volumes:
      - .:/src
      - maven-repo:/root/.m2
    command: mvn -B clean package

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NORTHLAKE | RIVERTON | SUMMIT - see docs/FORKS.md.
        CUSTOMER_CODE: NORTHLAKE
    container_name: campusconnect-app
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      # XXX: read by nothing. The real configuration is compiled into web.xml.
      CUSTOMER_CODE: NORTHLAKE
      JAVA_OPTS: "-Xms256m -Xmx512m"

volumes:
  mysql-data:
  maven-repo:
