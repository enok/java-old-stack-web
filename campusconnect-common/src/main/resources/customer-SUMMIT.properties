# Summit Community College - smallest installation, two-year programs.
customer.code=SUMMIT
customer.displayName=Summit Community College
support.email=counseling@summit.example.edu

appointment.slotMinutes=20
appointment.maxPerDay=18
appointment.allowWalkIn=true
appointment.leadTimeHours=2

earlyalert.autoCaseThreshold=1.75
earlyalert.notifyAdvisor=false
earlyalert.escalateAfterDays=14

sis.importFormat=CC_XML_V1
sis.fileNamePattern=summit_students_*.xml
sis.requireAdvisorId=false

term.current=FA2014

# Student Finance. Summit's threshold is the lowest and its statement is the
# only one grouped by term.
billing.holdThreshold=250.00
# NOTE: StudentAccountService.lateFeeAmountFor() caps Summit at 10.00 in code as
# well. If this value is raised the code wins, the same way the appointment lead
# time does.
billing.lateFeeAmount=10.00
billing.lateFeeRule=FLAT
billing.gracePeriodDays=30
billing.statementFormat=SUMMIT_TERM_GROUPED
billing.currencySymbol=$
billing.tuitionPerCredit=142.00
