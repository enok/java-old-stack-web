# Riverton State University - largest installation, most divergent.
customer.code=RIVERTON
customer.displayName=Riverton State University
support.email=successcoaching@riverton.example.edu

appointment.slotMinutes=45
appointment.maxPerDay=8
appointment.allowWalkIn=false
appointment.leadTimeHours=48

earlyalert.autoCaseThreshold=2.25
earlyalert.notifyAdvisor=true
earlyalert.escalateAfterDays=5
# Riverton only: athletics compliance office is copied on every case.
earlyalert.ccAthletics=true

sis.importFormat=CC_XML_V1
sis.fileNamePattern=RVT_STU_*.xml
sis.requireAdvisorId=true
# Riverton only: the SIS sends a campus code we have to map.
sis.campusCodeMap=MAIN:1,NORTH:2,ONLINE:9

term.current=FA2014

# Student Finance. Riverton's bursar sets the highest threshold and charges a
# percentage rather than a flat late fee.
billing.holdThreshold=1000.00
billing.lateFeeAmount=75.00
billing.lateFeeRule=PERCENT
billing.lateFeePercent=1.5
billing.gracePeriodDays=5
billing.statementFormat=STANDARD
billing.currencySymbol=$
billing.tuitionPerCredit=418.00
# Riverton only: athletics compliance settles athlete accounts separately, so an
# athlete's hold does not block advising appointments. Read by FinancialHoldService.
billing.athleteHoldExempt=true
