# Northlake University - reference / "default" installation.
customer.code=NORTHLAKE
customer.displayName=Northlake University
support.email=advising-help@northlake.example.edu

appointment.slotMinutes=30
appointment.maxPerDay=12
appointment.allowWalkIn=true
appointment.leadTimeHours=24

earlyalert.autoCaseThreshold=2.00
earlyalert.notifyAdvisor=true
earlyalert.escalateAfterDays=10

sis.importFormat=CC_XML_V1
sis.fileNamePattern=northlake-students-*.xml
sis.requireAdvisorId=false

term.current=FA2014

# Student Finance (added 2016). Reference values - the other two customers'
# files are diffed against this one when a key is forgotten.
billing.holdThreshold=500.00
billing.lateFeeAmount=25.00
billing.lateFeeRule=FLAT
billing.gracePeriodDays=10
billing.statementFormat=STANDARD
billing.currencySymbol=$
billing.tuitionPerCredit=310.00
